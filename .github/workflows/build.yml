name: Build

on:
  pull_request:
    branches:
      - v3
  push:
    branches:
      - v3

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Build and test: linux-amd64 (native; tests run inline)
  # -------------------------------------------------------------------
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test linux-amd64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-amd64

  # -------------------------------------------------------------------
  # Build: linux-arm64 (cross-compiled on amd64)
  # -------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux-arm64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-arm64

      - name: Upload linux-arm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-arm64-tests-${{ github.run_id }}
          path: build/tests/linux-arm64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: linux-arm64 (run natively on ARM64 runner)
  # -------------------------------------------------------------------
  test-linux-arm64:
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download linux-arm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: build-linux-arm64-tests-${{ github.run_id }}
          path: tests/

      - name: Run linux-arm64 tests
        shell: bash
        run: |
          for test_file in tests/*; do
            [ -f "$test_file" ] || continue
            chmod +x "$test_file"
            echo "Running $(basename "$test_file")..."
            "$test_file" -test.v || exit 1
          done

  # -------------------------------------------------------------------
  # Build: windows-amd64 (cross-compiled on Linux via mingw-w64)
  # -------------------------------------------------------------------
  build-windows-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build windows-amd64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh windows-amd64

      - name: Upload windows-amd64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-amd64-tests-${{ github.run_id }}
          path: build/tests/windows-amd64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: windows-amd64 (run natively on Windows runner)
  # -------------------------------------------------------------------
  test-windows-amd64:
    needs: build-windows-amd64
    runs-on: windows-latest
    steps:
      - name: Download windows-amd64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: build-windows-amd64-tests-${{ github.run_id }}
          path: tests

      - name: Run windows-amd64 tests
        shell: powershell
        run: |
          $Files = Get-ChildItem -Path tests -File
          foreach ($File in $Files) {
            Write-Host "Running $($File.Name)..."
            & $File.FullName "-test.v"
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $($File.Name)"
            }
          }
