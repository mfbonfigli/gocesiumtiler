name: Draft Release

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: write
  actions: read

jobs:
  # -------------------------------------------------------------------
  # Build and test: linux-amd64 (native; tests run inline)
  # -------------------------------------------------------------------
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test linux-amd64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-amd64 --version "${VERSION#v}"

      - name: Upload linux-amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-amd64
          path: build/linux-amd64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Build: linux-arm64 (cross-compiled on amd64)
  # -------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux-arm64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-arm64 --version "${VERSION#v}"

      - name: Upload linux-arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-arm64
          path: build/linux-arm64/
          if-no-files-found: error

      - name: Upload linux-arm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-arm64-tests
          path: build/tests/linux-arm64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: linux-arm64 (run natively on ARM64 runner)
  # -------------------------------------------------------------------
  test-linux-arm64:
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download linux-arm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-arm64-tests
          path: tests/

      - name: Run linux-arm64 tests
        shell: bash
        run: |
          for test_file in tests/*; do
            [ -f "$test_file" ] || continue
            chmod +x "$test_file"
            echo "Running $(basename "$test_file")..."
            "$test_file" -test.v || exit 1
          done

  # -------------------------------------------------------------------
  # Build: windows-amd64 (cross-compiled on Linux via mingw-w64)
  # -------------------------------------------------------------------
  build-windows-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build windows-amd64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh windows-amd64 --version "${VERSION#v}"

      - name: Upload windows-amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-windows-amd64
          path: build/windows-amd64/
          if-no-files-found: error

      - name: Upload windows-amd64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-windows-amd64-tests
          path: build/tests/windows-amd64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: windows-amd64 (run natively on Windows runner)
  # -------------------------------------------------------------------
  test-windows-amd64:
    needs: build-windows-amd64
    runs-on: windows-latest
    steps:
      - name: Download windows-amd64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: gotiler-windows-amd64-tests
          path: tests

      - name: Run windows-amd64 tests
        shell: powershell
        run: |
          $Files = Get-ChildItem -Path tests -File
          foreach ($File in $Files) {
            Write-Host "Running $($File.Name)..."
            & $File.FullName "-test.v"
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $($File.Name)"
            }
          }

  # -------------------------------------------------------------------
  # Create draft GitHub Release with 3 per-platform zip files
  # -------------------------------------------------------------------
  create-release:
    needs:
      - build-linux-amd64
      - test-linux-arm64
      - test-windows-amd64
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-amd64
          path: artifacts/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-arm64
          path: artifacts/linux-arm64

      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-windows-amd64
          path: artifacts/windows-amd64

      - name: Create release zips
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p release-zips

          # --- linux-amd64 ---
          mkdir -p pkg
          cp artifacts/linux-amd64/gotiler-lin-amd64 pkg/gotiler
          chmod +x pkg/gotiler
          cp -r artifacts/linux-amd64/share pkg/
          cp README.md LICENSE.md THIRD-PARTY-LICENSES.md pkg/
          (cd pkg && zip -r "../release-zips/gotiler-linux-amd64-${TAG}.zip" .)
          rm -rf pkg

          # --- linux-arm64 ---
          mkdir -p pkg
          cp artifacts/linux-arm64/gotiler-lin-arm64 pkg/gotiler
          chmod +x pkg/gotiler
          cp -r artifacts/linux-arm64/share pkg/
          cp README.md LICENSE.md THIRD-PARTY-LICENSES.md pkg/
          (cd pkg && zip -r "../release-zips/gotiler-linux-arm64-${TAG}.zip" .)
          rm -rf pkg

          # --- windows-amd64 ---
          mkdir -p pkg
          cp artifacts/windows-amd64/gotiler-win-amd64.exe pkg/gotiler.exe
          cp -r artifacts/windows-amd64/share pkg/
          cp README.md LICENSE.md THIRD-PARTY-LICENSES.md pkg/
          (cd pkg && zip -r "../release-zips/gotiler-windows-amd64-${TAG}.zip" .)
          rm -rf pkg

          echo "Release zips created:"
          ls -la release-zips/

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          name: ${{ github.ref_name }}
          body: |
            ## gotiler ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `gotiler-linux-amd64-${{ github.ref_name }}.zip` |
            | Linux ARM64  | `gotiler-linux-arm64-${{ github.ref_name }}.zip` |
            | Windows x86_64 | `gotiler-windows-amd64-${{ github.ref_name }}.zip` |

            Each zip contains the executable, PROJ data files (`share/`), and license documentation.
          files: release-zips/*.zip
